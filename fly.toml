# fly.toml — deploys venture-os/agent-engine (see Dockerfile). This is the
# single source of truth Fly's GitHub integration reads from; there is no
# separate fly.toml inside venture-os/agent-engine/ anymore, to avoid the
# confusion of two configs where only one is actually used.

app = 'ventureos'
primary_region = 'iad'

[build]

# `app` serves the API (what judges / the dashboard hit); `worker` polls
# CockroachDB and executes the emergency-plan task chain. Both need the
# same secrets set via `flyctl secrets set` (COCRAOCH_DB_URL,
# MISTRAL_API_KEY, SUPABASE_URL, SUPABASE_KEY, SUPABASE_SERVICE_KEY,
# DEFAULT_LLM_MODEL, and optionally AWS_S3_BUCKET/AWS_REGION/
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY).
[processes]
  app = "uvicorn api.main:app --host 0.0.0.0 --port 8000"
  worker = "python worker.py"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
